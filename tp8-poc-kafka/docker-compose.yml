# POC Activación de Servicios con Kafka · fase 2
# Levantar todo: docker compose up --build
# Demo UI http://localhost:5173 · Kafka UI http://localhost:8080 · Mailhog http://localhost:8025 · API http://localhost:3000

x-backend: &backend
  build: .
  image: activation-poc-backend:local
  restart: on-failure
  environment: &backend-env
    KAFKA_BROKERS: kafka:29092
    MONGO_URI: mongodb://mongo:27017/?directConnection=true
    KAFKAJS_NO_PARTITIONER_WARNING: "1"
  depends_on: &backend-deps
    kafka-init:
      condition: service_completed_successfully
    mongo:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller # modo KRaft: sin ZooKeeper
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: activation-poc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7
    # Replica set de un nodo: hace falta para las transacciones del outbox (fase 4).
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'mongo:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 5s

  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

  activation-api:
    <<: *backend
    command: ["node", "dist/apps/activation-api/src/main.js"]
    ports:
      - "3000:3000"
    environment:
      <<: *backend-env
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api

  billing-service:
    <<: *backend
    command: ["node", "dist/apps/billing-service/src/main.js"]
    environment:
      <<: *backend-env
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-service

  provisioning-service:
    <<: *backend
    command: ["node", "dist/apps/provisioning-service/src/main.js"]
    environment:
      <<: *backend-env
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-service

  notification-service:
    <<: *backend
    command: ["node", "dist/apps/notification-service/src/main.js"]
    environment:
      <<: *backend-env
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-service
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
    depends_on:
      <<: *backend-deps
      mailhog:
        condition: service_started

  crm-analytics-service:
    <<: *backend
    command: ["node", "dist/apps/crm-analytics-service/src/main.js"]
    environment:
      <<: *backend-env
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics-service

  demo-ui:
    build:
      context: ./apps/demo-ui
      args:
        VITE_API_URL: http://localhost:3000
    ports:
      - "5173:80"
    depends_on:
      - activation-api
